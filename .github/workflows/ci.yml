name: "Chilean Rut CI"

on:
  pull_request:
    branches: ['master']
    paths:
      - '**.php'
      - 'composer.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/php.yml'
  push:
    branches: ['master']
    paths:
      - '**.php'
      - 'composer.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/php.yml'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ci:
    name: 'CI'
    uses: ./.github/workflows/php.yml
    with:
      php-version: '8.2'
      composer-cmd: install --ansi --no-interaction --no-progress --prefer-dist
    secrets: inherit